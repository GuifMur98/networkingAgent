[project]
name = "networking-agent"
version = "2.1.1"
description = "Enterprise Autonomous & Closed-Loop AI Network Engineering Assistant"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Networking Agent Team" }
]
dependencies = [
    "anthropic>=2.6.0",
    "cryptography>=44.0.0",
    "google-genai>=2.30.1",
    "netmiko>=4.8.0",
    "ollama>=0.6.3",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.6.0",
    "rich>=13.9.0",
    "textual>=1.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
networking-agent = "networking_agent.cli.main:cli_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/networking_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
]
