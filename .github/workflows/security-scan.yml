name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1' # Runs weekly on Mondays

jobs:
  audit-dependencies:
    name: Dependency & Secret Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Scan Code for Dangerous Patterns & Injections
        run: uv run ruff check .
