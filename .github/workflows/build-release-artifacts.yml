name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build Standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set Up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies & PyInstaller
        run: |
          uv sync --extra dev
          uv pip install "pyinstaller>=6.11.0" "pillow>=10.0.0" "pefile>=2023.2.7"

      - name: Install Windows Native Build Dependencies
        if: runner.os == 'Windows'
        run: |
          uv pip install "pywin32>=306"

      - name: Compile Standalone Release Package
        run: uv run python scripts/build_standalone.py

      - name: Verify Generated Release Artifacts
        shell: bash
        run: |
          echo "Listing release-artifacts:"
          ls -la release-artifacts/
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ ! -f release-artifacts/NetworkingAgent-v2.2.0-Setup.exe ]; then
              echo "Error: NetworkingAgent-v2.2.0-Setup.exe was not created in release-artifacts!"
              exit 1
            fi
            echo "[SUCCESS] NetworkingAgent-v2.2.0-Setup.exe is present and verified."
          fi

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: release-artifacts/*

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
